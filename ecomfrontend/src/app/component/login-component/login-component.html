<div class="container">
  <div class="row justify-content-center mt-5">

    <div class="col-md-4">

      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h4>Login</h4>
        </div>

        <div class="card-body">

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label>Email</label>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="Enter email"
              />

              <small class="text-danger"
                *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].invalid">
                Valid Email Required
              </small>
            </div>

            <div class="mb-3">
              <label>Password</label>
              <input
                type="password"
                class="form-control"
                formControlName="password"
                placeholder="Enter password"
              />

              <small class="text-danger"
                *ngIf="loginForm.controls['password'].touched && loginForm.controls['password'].invalid">
                Password Required
              </small>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
              Login
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>
</div>
