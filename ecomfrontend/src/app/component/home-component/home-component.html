<div class="container-fluid">

  <!-- HEADER -->
  <div class="row bg-primary text-white p-3 align-items-center">

    <div class="col-md-6">
      <h5 class="mb-0">
        {{userName}} - {{role}}
      </h5>
    </div>

    <div class="col-md-6 text-end">
      <button class="btn btn-light" (click)="logout()">
        Logout
      </button>
    </div>

  </div>


  <!-- DASHBOARD TILES -->
<div class="container-fluid mt-4">

  <div class="row g-4">

    @for (tile of tiles; track tile) {

      <div class="col-12" (click)="navigate(tile.title)">

        <div class="card dashboard-tile shadow">

          <div class="card-body d-flex justify-content-between align-items-center">

            <h4 class="mb-0">
              {{ tile.title }}
            </h4>

            <h1 class="text-primary mb-0">
              {{ tile.count }}
            </h1>

          </div>

        </div>

      </div>

    }

  </div>

</div>
</div>
